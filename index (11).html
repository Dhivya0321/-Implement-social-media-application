<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Social Media Dashboard</title>
    <style>
        /* CSS Embedded inside HTML */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0b0f17;
            color: #f1f5f9;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 30px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { color: #38bdf8; margin: 0; font-size: 26px; }
        
        /* Profile Telemetry Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background-color: #111827;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .metric-card h3 { margin: 0 0 5px 0; color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
        .metric-card .value { font-size: 28px; font-weight: bold; color: #f8fafc; }

        /* Dashboard Split Layout Architecture */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }
        @media (max-width: 800px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: #111827;
            border: 1px solid #1e293b;
            padding: 20px;
            border-radius: 12px;
            height: fit-content;
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; font-size: 16px; color: #38bdf8; border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 15px; }

        /* Form Controls */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: #94a3b8; font-size: 13px; }
        input, textarea {
            width: 100%; padding: 10px; background-color: #0b0f17;
            border: 1px solid #334155; color: white; border-radius: 6px;
            box-sizing: border-box; outline: none; font-size: 14px;
            font-family: inherit;
        }
        textarea { resize: none; height: 100px; }
        
        button {
            width: 100%; padding: 10px; background-color: #38bdf8;
            color: #0b0f17; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s;
        }
        button:hover { background-color: #0ea5e9; }

        /* Social Post Feed Components */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .post-card {
            background-color: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .post-author { color: #38bdf8; font-weight: bold; }
        .post-time { color: #64748b; }
        .post-content {
            font-size: 15px; line-height: 1.5; color: #e2e8f0; margin-bottom: 15px;
            white-space: pre-wrap;
        }
        
        /* Post Action Interaction Links */
        .post-actions {
            display: flex;
            gap: 20px;
            border-top: 1px solid #1e293b;
            padding-top: 12px;
        }
        .action-btn {
            background: none; border: none; color: #94a3b8; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 0; width: auto;
        }
        .action-btn:hover { color: #38bdf8; }
        .action-btn.liked { color: #f43f5e; }
        .action-btn.delete-btn:hover { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>Nexus Hub Space</h1>
                <div style="font-size: 13px; color: #64748b; margin-top: 4px;">Local Engine Identity Profile Logging Portal</div>
            </div>
        </header>

        <div class="metrics-grid">
            <div class="metric-card">
                <h3>Total Post Submissions</h3>
                <div class="value" id="totalPostsCount">0</div>
            </div>
            <div class="metric-card">
                <h3>Aggregated App Likes</h3>
                <div class="value" id="totalLikesCount" style="color: #f43f5e;">0</div>
            </div>
            <div class="metric-card">
                <h3>Active Engagement Pool</h3>
                <div class="value" id="engagementRate" style="color: #a855f7;">0%</div>
            </div>
        </div>

        <div class="main-layout">
            <div>
                <div class="panel">
                    <h2>Broadcast Network Post</h2>
                    <form id="postForm">
                        <div class="form-group">
                            <label for="usernameInput">User Handle Signature</label>
                            <input type="text" id="usernameInput" placeholder="e.g., alex_tech" required>
                        </div>
                        <div class="form-group">
                            <label for="postContentInput">What's on your mind?</label>
                            <textarea id="postContentInput" placeholder="Share code snippets, updates, or thought streams..." required></textarea>
                        </div>
                        <button type="submit">Publish Stream Entry</button>
                    </form>
                </div>

                <div class="panel">
                    <h2>Filter Stream Content</h2>
                    <div class="form-group" style="margin-bottom: 0;">
                        <input type="text" id="searchInput" placeholder="Search by author or keywords...">
                    </div>
                </div>
            </div>

            <div>
                <h2 style="margin-top: 0; font-size: 18px; color: #f8fafc; padding-bottom: 10px;">Global Network Stream</h2>
                <div class="feed-container" id="feedContainer">
                    </div>
            </div>
        </div>
    </div>

    <script src="socialEngine.js"></script>
</body>
</html>
